experiment_version: "0.1.0"
global_seed: 26160
replicate_seeds: [11, 22, 33, 44, 55]
calibration_fraction_by_group: 0.20
prediction_set_alpha: 0.10
generalization_splits:
  - leave_one_configuration_out
  - leave_one_cipher_out
  - leave_one_mode_out
  - ipv4_train_ipv6_test
  - native_esp_train_nat_t_test
  - strongswan_train_second_stack_test_if_feasible
  - unseen_application_ood
incomplete_capture_loss_fractions: [0.10, 0.30, 0.50]
metrics:
  protocol: [field_accuracy, precision, recall, macro_f1]
  configuration: [exact_match, macro_f1, constraint_violation_rate]
  traffic: [balanced_accuracy, macro_f1, one_vs_rest_auroc]
  calibration: [ece_15_bin, brier, nll]
  prediction_sets: [coverage, mean_size, median_size]
  ood: [auroc, fpr95]
  systems: [latency_mean_ms, latency_p50_ms, latency_p95_ms, latency_p99_ms]
  active_learning: [labels_to_target_performance, area_under_learning_curve]
result_policy: "No numerical result may be entered until generated by a versioned experiment manifest; otherwise use TBD — requires experiment."
