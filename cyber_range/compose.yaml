services:
  left:
    build:
      context: ..
      dockerfile: cyber_range/Dockerfile
    cap_add: [NET_ADMIN]
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv6.conf.all.forwarding: "1"
    environment:
      VGX_ROLE: gateway
    volumes:
      - ${VGX_RUN_DIR}/left/swanctl.conf:/etc/swanctl/swanctl.conf:ro
      - ${VGX_RUN_DIR}:/scenario
    networks:
      transit:
        ipv4_address: 10.80.0.10
        ipv6_address: fd00:80::10
      natt_side:
        ipv4_address: 10.81.0.10
      left_lan:
        ipv4_address: 10.11.0.1
        ipv6_address: fd00:11::1
  right:
    build:
      context: ..
      dockerfile: cyber_range/Dockerfile
    cap_add: [NET_ADMIN]
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv6.conf.all.forwarding: "1"
    environment:
      VGX_ROLE: gateway
    volumes:
      - ${VGX_RUN_DIR}/right/swanctl.conf:/etc/swanctl/swanctl.conf:ro
      - ${VGX_RUN_DIR}:/scenario
    networks:
      transit:
        ipv4_address: 10.80.0.20
        ipv6_address: fd00:80::20
      right_lan:
        ipv4_address: 10.22.0.1
        ipv6_address: fd00:22::1
  nat:
    build:
      context: ..
      dockerfile: cyber_range/Dockerfile
    cap_add: [NET_ADMIN]
    sysctls:
      net.ipv4.ip_forward: "1"
    environment:
      VGX_ROLE: nat_router
    networks:
      transit:
        ipv4_address: 10.80.0.1
      natt_side:
        ipv4_address: 10.81.0.1
  left_client:
    build:
      context: ..
      dockerfile: cyber_range/Dockerfile
    cap_add: [NET_ADMIN]
    environment:
      VGX_ROLE: left_client
    command: ["sleep", "infinity"]
    networks:
      left_lan:
        ipv4_address: 10.11.0.20
        ipv6_address: fd00:11::20
  right_server:
    build:
      context: ..
      dockerfile: cyber_range/Dockerfile
    cap_add: [NET_ADMIN]
    environment:
      VGX_ROLE: right_server
    command: ["python3", "/opt/vgx/traffic_server.py"]
    networks:
      right_lan:
        ipv4_address: 10.22.0.20
        ipv6_address: fd00:22::20

networks:
  transit:
    internal: true
    enable_ipv6: true
    ipam:
      config:
        - subnet: 10.80.0.0/24
          gateway: 10.80.0.254
        - subnet: fd00:80::/64
          gateway: fd00:80::fffe
  natt_side:
    internal: true
    ipam:
      config:
        - subnet: 10.81.0.0/24
          gateway: 10.81.0.254
  left_lan:
    internal: true
    enable_ipv6: true
    ipam:
      config:
        - subnet: 10.11.0.0/24
          gateway: 10.11.0.254
        - subnet: fd00:11::/64
          gateway: fd00:11::fffe
  right_lan:
    internal: true
    enable_ipv6: true
    ipam:
      config:
        - subnet: 10.22.0.0/24
          gateway: 10.22.0.254
        - subnet: fd00:22::/64
          gateway: fd00:22::fffe
